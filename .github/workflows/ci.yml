name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CI via make
        run: make ci
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: out/result.json